name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing (VNC) on macOS
        run: |
          echo "=== Configuring Screen Sharing Settings ==="
          # Load the native Apple Screen Sharing Daemon
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Enable remote connections globally
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPrivilegeSoftwareUpdate -bool YES
          
          echo "=== Setting Up Dedicated VNC Password ==="
          # Configure VNC specifically to use the password 'RdpMac123!' without modifying account passwords
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpasswd -vncpasswd "RdpMac123!"
          
          # Force refresh the Remote Management subsystem
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -privs -all
          echo "Screen Sharing successfully configured for remote access!"

      - name: Connect Tailscale using Official Action
        # This completely replaces custom scripts and solves the 'command not found' path error
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-runner-${{ github.run_id }}

      - name: Maintain Connection & Output Access Details
        run: |
          # Fetch the active Tailscale IP from the system setup interface
          TS_IP=$(ifconfig | grep -A 2 "utun" | grep "inet " | awk '{print $2}' | head -n 1)
          
          if [ -z "$TS_IP" ]; then
             # Fallback check method if the interface indexing differs
             TS_IP="Check Tailscale Dashboard / Log Link Above"
          fi
          
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TS_IP"
          echo "Username: runner"
          echo "Password: RdpMac123!"
          echo "====================================\n"
          
          # Keep the session active indefinitely up to the timeout limit
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
