name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    # GitHub free tier-il macOS run aavadharkana label
    runs-on: macos-latest
    # GitHub free tier-il individual jobs-ukku maximum 6 mani neram (360 nimidangal) dhaan limit
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing (VNC) on macOS
        run: |
          echo "=== Configuring Screen Sharing Settings ==="
          # macOS-il ulla Remote Desktop / Screen Sharing-ai activate seiya
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # VNC connections-ai strictly enable seiya
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          echo "Screen Sharing successfully configured!"

      - name: Create macOS User with Secure Password
        run: |
          echo "=== Generating Secure Random Password ==="
          # 16-character secure random password-ai generate seiya
          PASSWORD=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 16)
          
          # Adutha steps-il use seiyum padi GitHub environment-il save seiya
          echo "VNC_PASS=$PASSWORD" >> $GITHUB_ENV
          
          echo "=== Registering macOS User ==="
          # dscl interactive freeze-ai thavirka 'sysadminctl' moolam admin user-ai udanae create seigiron
          sudo sysadminctl -addUser macuser -fullName "Mac User" -password "$PASSWORD" -admin
          
          # VNC access global settings password-ai update seiya
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPassword -string "$PASSWORD"
          echo "User 'macuser' successfully created with Admin privileges!"

      - name: Install Tailscale on macOS
        run: |
          echo "=== Downloading and Installing Tailscale Package ==="
          # macOS standalone stable msi/pkg download seithu install seiya
          curl -L "https://tailscale.com" -o tailscale.pkg
          sudo installer -pkg tailscale.pkg -target /
          rm tailscale.pkg
          echo "Tailscale successfully installed!"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Starting Tailscale Service ==="
          # Tailscale service-ai authkey moolam ungal account-udan inaikkavum
          sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          # Tailscale assigned private IP-ai fetch seiya oru loop
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: macuser"
          echo "Password: $VNC_PASS"
          echo "====================================\n"
          
          # Connection cut aagadha padi runner-ai thodarchiyaga active-aga vaika
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
