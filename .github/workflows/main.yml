name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    # GitHub Server-in macOS suzhalai payanpadutha indha label mukkiyam
    runs-on: macos-latest
    # GitHub free tier-il maximum limit 360 nimidangal (6 mani neram) mattumae odum
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing (VNC) on macOS
        run: |
          echo "=== Screen Sharing Settings Configuration ==="
          # macOS-il ulla Remote Desktop / Screen Sharing-ai activate seiya
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Connection rules-ai enable seiya
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          
          echo "Screen Sharing successfully configured!"

      - name: Create macOS User with Secure Password
        run: |
          echo "=== Creating Secure Random Password ==="
          # 16-character secure random password-ai generate seiya
          PASSWORD=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 16)
          
          # GitHub variables-il save seiya
          echo "VNC_PASS=$PASSWORD" >> $GITHUB_ENV
          
          echo "=== Registering macOS User ==="
          # 'macuser' endra pudhiya account-ai create seiya
          sudo dscl . -create /Users/macuser
          sudo dscl . -create /Users/macuser UserShell /bin/bash
          sudo dscl . -create /Users/macuser RealName "Mac User"
          sudo dscl . -create /Users/macuser UniqueID 501
          sudo dscl . -create /Users/macuser PrimaryGroupID 20
          sudo dscl . -create /Users/macuser NFSHomeDirectory /Users/macuser
          sudo dscl . -passwd /Users/macuser "$PASSWORD"
          
          # Andha user-ai Administrator group-il serkka (Permissions thara)
          sudo dscl . -append /Groups/admin GroupMembership macuser
          
          # VNC access-ukaga password encryption set seiya
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPassword -string "$PASSWORD"
          
          echo "User creation successful!"

      - name: Install Tailscale on macOS
        run: |
          echo "=== Downloading and Installing Tailscale via Homebrew ==="
          # macOS standalone pkg download seiya
          curl -L "https://tailscale.com" -o tailscale.pkg
          sudo installer -pkg tailscale.pkg -target /
          rm tailscale.pkg

      - name: Establish Tailscale Connection
        run: |
          echo "=== Starting Tailscale Service ==="
          # macOS-il background service run seiya tailscaled start seigiron
          sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          # Tailscale Assigned IP-ai kandupidippadhu
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(/Applications/Tailscale.app/Contents/MacOS/Tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: macuser"
          echo "Password: $VNC_PASS"
          echo "====================================\n"
          
          # Free runner terminate aagaamal thodarchiyaga odividuvatharku loop
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
