name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing (VNC) on macOS
        run: |
          echo "=== Configuring Screen Sharing Settings ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPrivilegeSoftwareUpdate -bool YES
          
          echo "=== Setting Up Dedicated VNC Password ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpasswd -vncpasswd "RdpMac123!"
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -privs -all
          echo "Screen Sharing successfully configured for remote access!"

      - name: Download and Install Tailscale Standalone CLI
        run: |
          echo "=== Downloading Tailscale macOS Binary ==="
          # ஹோம்ப்ரூ பாத் சிக்கல்களைத் தவிர்க்க நேரடியாக அதிகாரப்பூர்வ ஸ்டாண்டலோன் கம்பைல்டு பைனரியை டவுன்லோட் செய்கிறோம்
          curl -L "https://tailscale.com" -o tailscale.tgz
          
          echo "=== Extracting and Installing Binaries ==="
          tar -xzf tailscale.tgz
          cd tailscale_*
          
          # உலகளாவிய சிஸ்டம் பாத்திற்கு பைனரிகளை நகர்த்துகிறோம்
          sudo mkdir -p /usr/local/bin
          sudo cp tailscale /usr/local/bin/
          sudo cp tailscaled /usr/local/bin/
          
          echo "Tailscale CLI binaries successfully placed in /usr/local/bin/"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Force Starting Tailscale Daemon ==="
          # ஸ்டேட் ஃபைலை டிபைன் செய்து டீமானை நேரடியாக பின்னணியில் இயக்குகிறோம்
          sudo /usr/local/bin/tailscaled --state=local &
          
          # டீமான் முழுமையாகத் துவங்க 10 வினாடிகள் காத்திருக்கிறோம்
          sleep 10
          
          echo "=== Authenticating Tailscale Connection ==="
          # இதிலுள்ள லாகின் லிங்கை கிளிக் செய்து நீங்கள் கனெக்ட் செய்யலாம்
          sudo /usr/local/bin/tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-mac-runner-$GITHUB_RUN_ID \
            --accept-risk=lose-ssh
          
          # IP முகவரியை கண்டறியும் லூப்
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 12 ]; do
              TS_IP=$(/usr/local/bin/tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection & Output Access Details
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: runner"
          echo "Password: RdpMac123!"
          echo "====================================\n"
          
          # கணினி அணைந்துவிடாமல் இருக்க Keep-Alive லூப்
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
