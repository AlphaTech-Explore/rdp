name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing (VNC) on macOS
        run: |
          echo "=== Configuring Screen Sharing Settings ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCPrivilegeSoftwareUpdate -bool YES
          
          echo "=== Setting Up Dedicated VNC Password ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpasswd -vncpasswd "RdpMac123!"
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -privs -all
          echo "Screen Sharing successfully configured for remote access!"

      - name: Download and Extract Tailscale
        run: |
          echo "=== Downloading Official Tailscale macOS Zip ==="
          # Downloading the verified stable universal zip package directly from Tailscale CDN
          curl -L "https://tailscale.com" -o tailscale.zip
          
          echo "=== Unzipping Binaries ==="
          unzip -q tailscale.zip
          
          # Move inside the extracted folder dynamically to copy clean standalone binaries
          cd tailscale_*
          cp tailscale ../
          cp tailscaled ../
          cd ..
          
          # Clean up temporary zip and folder resources
          rm -rf tailscale.zip tailscale_*
          
          echo "Successfully extracted local binaries!"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Force Starting Local Tailscale Daemon ==="
          # Execute the standalone daemon binary locally in the background safely
          sudo ./tailscaled --state=local.state > /dev/null 2>&1 &
          
          # Wait 10 seconds for the system engine to initialize safely
          sleep 10
          
          echo "=== Authenticating Tailscale Connection ==="
          # Triggering the dynamic interactive link generation safely into the log window
          sudo ./tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-mac-runner-$GITHUB_RUN_ID \
            --accept-risk=lose-ssh
          
          # Loop layout to monitor the active network stack interface assignment
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 12 ]; do
              TS_IP=$(./tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection & Output Access Details
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: runner"
          echo "Password: RdpMac123!"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
