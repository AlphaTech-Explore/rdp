name: MacOS RDP via Automated VNC

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Pure VNC Server Tools
        run: |
          echo "=== Installing Python VNC Automation ==="
          # ஹோம்ப்ரூவ் எர்ரர்களை தவிர்க்க பைத்தான் மூலமாக விர்ச்சுவல் VNC சர்வரை இன்ஸ்டால் செய்கிறோம்
          pip3 install --upgrade pip
          pip3 install proxy.py
          
      - name: Enable Screen Sharing on Localhost Port
        run: |
          echo "=== Enabling Localhost VNC Forwarding ==="
          # ஆப்பிள் செக்யூரிட்டி லேயரை பைபாஸ் செய்ய லோக்கல்ஹோஸ்ட் போர்ட் 5900-ஐ ஓப்பன் செய்கிறோம்
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # எந்த பாஸ்வேர்ட்டும் கேட்காமல் இருக்க விர்ச்சுவல் லாக்ஸை கிளியர் செய்கிறோம்
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          
      - name: Install Tailscale CLI via Homebrew
        run: |
          echo "=== Installing Official Tailscale CLI ==="
          brew install tailscale
          echo "Tailscale binary successfully added to system environment!"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Force Starting Tailscale Daemon ==="
          sudo tailscaled --state=local.state &
          sleep 10
          
          echo "=== Authenticating Tailscale Connection ==="
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-mac-runner-$GITHUB_RUN_ID \
            --accept-risk=lose-ssh
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 12 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection & Output Access Details
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: runner"
          echo "Password: (Use your GitHub Runner Default or Blank)"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
