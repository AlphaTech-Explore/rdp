name: MacOS RDP via TigerVNC

on:
  workflow_dispatch:
    inputs:
      vnc_install_cmd:
        description: 'VNC Installation Command'
        required: true
        default: 'brew install tiger-vnc'

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install TigerVNC via Homebrew
        run: |
          echo "=== Running VNC Installation ==="
          ${{ github.event.inputs.vnc_install_cmd }}
          
      - name: Configure and Start TigerVNC Server
        run: |
          echo "=== Configuring Homebrew Environment Path ==="
          # ஹோம்ப்ரூவ் கமாண்டுகள் வேலை செய்ய பாத்தை கட்டாயமாக இணைக்கிறோம்
          if [ -d "/opt/homebrew/bin" ]; then
              export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          fi
          
          echo "=== Setting Up Passwordless/Custom VNC ==="
          mkdir -p ~/.vnc
          
          # vncpasswd கமாண்ட் எங்குள்ளது என்று தேடி அதன் முழுப் பாத்தையும் பயன்படுத்துகிறோம்
          VNC_PASS_PATH=$(which vncpasswd || echo "/opt/homebrew/bin/vncpasswd")
          VNC_SERVER_PATH=$(which vncserver || echo "/opt/homebrew/bin/vncserver")
          
          echo "Using VNC Pass Path: $VNC_PASS_PATH"
          echo "Using VNC Server Path: $VNC_SERVER_PATH"
          
          # பாஸ்வேர்ட் ஃபைலை உருவாக்குறோம்
          $VNC_PASS_PATH -f <<< "RdpMac123!" > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # விர்ச்சுவல் டிஸ்ப்ளே 1024x768 ரெசல்யூஷன்ல ஓப்பன் பண்றோம் (Port: 5901)
          $VNC_SERVER_PATH :1 -geometry 1024x768 -depth 24 -rfbauth ~/.vnc/passwd &
          
          sleep 5
          echo "TigerVNC Server successfully initialized!"

      - name: Install Tailscale CLI via Homebrew
        run: |
          echo "=== Installing Official Tailscale CLI ==="
          brew install tailscale
          echo "Tailscale binary successfully added to system environment!"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Force Starting Tailscale Daemon ==="
          sudo tailscaled --state=local.state &
          sleep 10
          
          echo "=== Authenticating Tailscale Connection ==="
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-mac-runner-$GITHUB_RUN_ID \
            --accept-risk=lose-ssh
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 12 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection & Output Access Details
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP:5901"
          echo "Username: (Leave Blank / Empty)"
          echo "Password: RdpMac123!"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
