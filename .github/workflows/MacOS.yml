name: MacOS RDP

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing with Standard Privileges
        run: |
          echo "=== Configuring Screen Sharing Settings ==="
          
          # Screen Sharing சர்வீஸை எனேபிள் செய்கிறோம்
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # சிஸ்டம் பாஸ்வேர்ட்டை மாற்றாமல், ஆப்பிள் ஏஜென்ட் வழியாக VNC-க்கு மட்டும் பிரத்யேக பாஸ்வேர்ட் செட் செய்கிறோம்
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -specifiedUsers
            
          # 'runner' யூசருக்கு மட்டும் முழுமையான ரிமோட் கண்ட்ரோல் உரிமைகளை வழங்குகிறோம்
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -access -on -privs -all -users runner
            
          # VNC லாகின் பாஸ்வேர்ட்டை 'RdpMac123!' என்று பிக்ஸ் செய்கிறோம்
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpasswd -vncpasswd "RdpMac123!"
            
          # VNC லாகின் முறையை சிஸ்டத்தில் உறுதி செய்கிறோம்
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEnabled -bool YES
          
          # சர்வீஸை ரீஸ்டார்ட் செய்கிறோம்
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent
          
          echo "Screen Sharing successfully configured for remote access!"

      - name: Install Tailscale CLI via Homebrew
        run: |
          echo "=== Installing Official Tailscale CLI ==="
          brew install tailscale
          echo "Tailscale binary successfully added to system environment!"

      - name: Establish Tailscale Connection
        run: |
          echo "=== Force Starting Tailscale Daemon ==="
          sudo tailscaled --state=local.state &
          sleep 10
          
          echo "=== Authenticating Tailscale Connection ==="
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-mac-runner-$GITHUB_RUN_ID \
            --accept-risk=lose-ssh
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 12 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP could not be assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale Connected Successfully!"

      - name: Maintain Connection & Output Access Details
        run: |
          echo -e "\n===================================="
          echo "        macOS ACCESS DETAILS        "
          echo "===================================="
          echo "Address : $TAILSCALE_IP"
          echo "Username: runner"
          echo "VNC Password: RdpMac123!"
          echo "====================================\n"
          
          while true; do
              echo "[$(date)] macOS Active - Keep-Alive loop running..."
              sleep 300
          done
