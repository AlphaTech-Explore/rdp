name: Windows VPN Server (Exit Node)

on:
  workflow_dispatch:

jobs:
  deploy-vpn:
    runs-on: windows-latest
    timeout-minutes: 31536000 # Unlimitted running (manual cancel varai)

    steps:
      - name: Enable IP Forwarding
        run: |
          # VPN traffic routing-ku ithu romba mukkiyam
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name "IPEnableRouter" -Value 1 -Force

      - name: Configure Firewall for Tailscale
        run: |
          # Tailscale traffic-ai firewall block seiyaamal irukka
          netsh advfirewall firewall add rule name="Allow Tailscale" dir=in action=allow protocol=Any

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Start Tailscale as Exit Node
        run: |
          # Advertise-exit-node flag moolamaa VPN-aaga maatrukirom
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-windows-server --advertise-exit-node
          
          # Status check
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Keep Server Active
        run: |
          Write-Host "=== VPN Server is Live ==="
          Write-Host "1. Go to Tailscale Admin Console"
          Write-Host "2. Edit Route Settings for 'gh-windows-server'"
          Write-Host "3. Approve 'Exit Node'"
          Write-Host "=========================="
          while ($true) {
              Write-Host "[$(Get-Date)] Server Running..."
              Start-Sleep -Seconds 300
          }
