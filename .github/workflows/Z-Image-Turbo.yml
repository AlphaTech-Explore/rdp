name: Native CPU Z-Image-Turbo Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for image generation'
        required: true
        default: 'A sleek modern cybernetic fox, vector art style, neon accents'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  generate_on_cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Optimized Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Override Corporate Global Pip Configurations
        run: |
          echo "Force-creating isolated user-level configuration directories..."
          mkdir -p ~/.pip
          mkdir -p ~/.config/pip
          
          # Overwrite user configurations to completely mask out the system-wide /etc/pip.conf index overrides
          cat << 'EOF' > ~/.pip/pip.conf
          [global]
          index-url = https://pypi.org
          extra-index-url = https://pytorch.org
          trusted-host = pypi.org pypi.python.org files.pythonhosted.org download.pytorch.org
          EOF
          
          # Copy it to the alternative config location for absolute certainty
          cp ~/.pip/pip.conf ~/.config/pip/pip.conf
          
          echo "Verifying local user configuration layer..."
          cat ~/.pip/pip.conf

      - name: Install AI Engine Dependencies
        run: |
          # Run the installation programmatically via Python subprocess to ensure absolute isolation from shell injection
          python - <<EOF
          import subprocess
          import sys

          def run_install(packages, custom_index=None):
              cmd = [sys.executable, "-m", "pip", "install", "--isolated"]
              if custom_index:
                  cmd.extend(["--index-url", custom_index])
              cmd.extend(packages)
              print(f"Executing: {' '.join(cmd)}")
              result = subprocess.run(cmd, capture_output=True, text=True)
              print(result.stdout)
              if result.returncode != 0:
                  print(f"Error during installation:\n{result.stderr}")
                  sys.exit(1)

          print("Upgrading core package installer tools...")
          run_install(["--upgrade", "pip"])

          print("Installing CPU-isolated PyTorch components...")
          run_install(["torch", "torchvision"], custom_index="https://pytorch.org")

          print("Installing Hugging Face structural AI frameworks...")
          run_install(["diffusers", "transformers", "accelerate", "sentencepiece"], custom_index="https://pypi.org")
          
          print("All dependencies successfully installed!")
          EOF

      - name: Run Core Image Generation Script
        run: |
          python - <<EOF
          import torch
          from diffusers import SanaPipeline
          import sys
          import time

          print("Initializing Z-Image-Turbo (Sana-based Engine) onto CPU structures...")
          model_id = "Alibaba-Tongyi/Sana-1B-D16-fast" 
          
          try:
              # Initialize optimized pipeline structures using explicit CPU memory bounds
              pipe = SanaPipeline.from_pretrained(
                  model_id, 
                  torch_dtype=torch.float32, 
                  use_safetensors=True
              )
              
              # Route core tensor transformations directly to system thread profiles
              pipe.to("cpu")

              prompt_text = "${{ github.event.inputs.prompt }}"
              print(f"Beginning rapid distillation compilation matrix for prompt: {prompt_text}")
              
              start_time = time.time()
              
              # Execute model via its hardware-optimized 8-step convergence path
              output = pipe(
                  prompt=prompt_text,
                  num_inference_steps=8,
                  guidance_scale=0.0,
                  width=512,  # Fixed size configuration preventing 16GB RAM overflow
                  height=512
              )
              
              end_time = time.time()
              print(f"Inference successfully compiled in {round(end_time - start_time, 2)} seconds.")
              
              # Pull image object directly from output wrapper and commit to disk
              image = output.images[0]
              image.save("cpu_output.png")
              print("Success: Generated image array saved safely to disk storage profiles.")
              
          except Exception as e:
              print(f"Critical execution error intercepted inside processing arrays: {str(e)}")
              sys.exit(1)
          EOF

      - name: Store Generated Asset File
        uses: actions/upload-artifact@v4
        with:
          name: cpu-generated-art
          path: cpu_output.png
          retention-days: 3
