name: Native CPU Z-Image-Turbo Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for image generation'
        required: true
        default: 'A sleek modern cybernetic fox, vector art style, neon accents'

jobs:
  generate_on_cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Optimized Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core torch library with optimized CPU execution backends
          # alongside the Hugging Face engine layer stack
          pip install torch torchvision --index-url https://pytorch.org
          pip install diffusers transformers accelerators sentencepiece

      - name: Run Core Image Generation Script
        run: |
          python - <<EOF
          import torch
          from diffusers import DiffusionPipeline
          import time

          print("Initializing Z-Image-Turbo Engine onto CPU structures...")
          model_id = "Alibaba-Tongyi/Z-Image-Turbo" # Exact Hugging Face Hub tracking ID
          
          try:
              # Initialize baseline pipeline structures targeting text-to-image variants
              # while enforcing lightweight data constraints to comfortably fit inside 16GB RAM limits
              pipe = DiffusionPipeline.from_pretrained(
                  model_id, 
                  torch_dtype=torch.float32, # Safe fallback for base CPU instruction matrices
                  use_safetensors=True
              )
              
              # Enforce low-overhead execution policies
              pipe.to("cpu")
              
              # Enable sequential layer processing options to maximize thread garbage collection
              if hasattr(pipe, "enable_sequential_cpu_offload"):
                  pipe.enable_sequential_cpu_offload()

              prompt_text = "${{ github.event.inputs.prompt }}"
              print(f"Beginning distillation compilation matrix for prompt: {prompt_text}")
              
              start_time = time.time()
              
              # Execute the model utilizing its rapid-convergence 8-step process
              image = pipe(
                  prompt=prompt_text,
                  num_inference_steps=8,
                  guidance_scale=0.0,
                  width=512,  # Optimized dimensions preventing RAM allocations from ballooning
                  height=512
              ).images[0]
              
              end_time = time.time()
              print(f"Inference successfully compiled in {round(end_time - start_time, 2)} seconds.")
              
              # Output raw binary matrix directly to disk assets
              image.save("cpu_output.png")
              print("Success: Generated image array saved safely to disk storage profiles.")
              
          except Exception as e:
              print(f"Critical execution error intercepted inside processing arrays: {str(e)}")
              import sys
              sys.exit(1)
          EOF

      - name: Store Generated Asset File
        uses: actions/upload-artifact@v4
        with:
          name: cpu-generated-art
          path: cpu_output.png
          retention-days: 3
