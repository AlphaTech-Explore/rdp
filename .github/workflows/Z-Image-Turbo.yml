name: Native CPU Z-Image-Turbo Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for image generation'
        required: true
        default: 'A sleek modern cybernetic fox, vector art style, neon accents'

jobs:
  generate_on_cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Launch Ollama Service via Container Engine
        run: |
          echo "Starting isolated Ollama container environment..."
          # Running via Docker avoids downloading raw scripts or handling tar archives manually.
          # Maps port 11434 directly to localhost.
          docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama-service ollama/ollama:latest
          
          echo "Waiting for local API loop stabilization..."
          for i in {1..20}; do
            if curl -s http://127.0.0 > /dev/null; then
              echo "Ollama API daemon container successfully bound and online!"
              exit 0
            fi
            sleep 2
          done
          echo "Error: Containerized Ollama daemon failed to bind port within time constraints."
          docker logs ollama-service
          exit 1

      - name: Pull Memory-Optimized Z-Image-Turbo Model Weights
        run: |
          echo "Instructing container engine to fetch distilled model layer arrays..."
          # Running inside the running container context to cleanly cache model configurations
          docker exec ollama-service ollama pull x/z-image-turbo:fp8

      - name: Generate Image via Localhost Endpoint
        run: |
          python - <<EOF
          import requests
          import json
          import base64
          import time

          endpoint = "http://127.0.0"
          
          # Exact parameters mapping structural Ollama multimodal payload definitions
          payload = {
              "model": "x/z-image-turbo:fp8",
              "prompt": "${{ github.event.inputs.prompt }}",
              "stream": False,
              "options": {
                  "num_predict": 8
              }
          }

          print("Submitting text prompt matrix to CPU local inference pool...")
          try:
              response = requests.post(endpoint, json=payload, timeout=600)
              if response.status_code != 200:
                  print(f"Server response breakdown: {response.status_code} - {response.text}")
                  sys.exit(1)
                  
              result = response.json()
              
              # Safely parse key configurations based on Ollama image synthesis endpoints
              img_b64 = result.get('image', result.get('response', ''))
              
              if img_b64:
                  # Sanitize potential formatting wrapper spaces
                  clean_b64 = img_b64.strip()
                  with open("cpu_output.png", "wb") as f:
                      f.write(base64.b64decode(clean_b64))
                  print("Success: Generated image array fully decoded to cpu_output.png")
              else:
                  print("Error: Target output signature array key missing from response schema.")
                  print(f"Available payload properties received: {list(result.keys())}")
                  exit(1)
          except Exception as e:
              print(f"Execution runtime crash caught: {str(e)}")
              exit(1)
          EOF

      - name: Upload Output Asset
        uses: actions/upload-artifact@v4
        with:
          name: cpu-generated-art
          path: cpu_output.png
          retention-days: 3
