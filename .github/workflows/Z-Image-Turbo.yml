name: Native CPU Z-Image-Turbo Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for image generation'
        required: true
        default: 'A sleek modern cybernetic fox, vector art style, neon accents'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  generate_on_cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Optimized Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          # Strict explicit mapping to CPU wheels to completely ignore heavy, volatile GPU binary overheads
          pip install torch torchvision --index-url https://pytorch.org
          # Install Hugging Face diffusion processing arrays 
          pip install diffusers transformers accelerators sentencepiece

      - name: Run Core Image Generation Script
        run: |
          python - <<EOF
          import torch
          from diffusers import SanaPipeline
          import sys
          import time

          print("Initializing Z-Image-Turbo (Sana-based Engine) onto CPU structures...")
          # Target path for the hardware-optimized model tracking ID
          model_id = "Alibaba-Tongyi/Sana-1B-D16-fast" 
          
          try:
              # Initialize baseline pipeline structures targeting pure CPU tensor spaces
              pipe = SanaPipeline.from_pretrained(
                  model_id, 
                  torch_dtype=torch.float32, 
                  use_safetensors=True
              )
              
              # Enforce pure CPU execution policies across the runtime lifecycle
              pipe.to("cpu")

              prompt_text = "${{ github.event.inputs.prompt }}"
              print(f"Beginning rapid distillation compilation matrix for prompt: {prompt_text}")
              
              start_time = time.time()
              
              # Run inference using its rapid-convergence 8-step process
              output = pipe(
                  prompt=prompt_text,
                  num_inference_steps=8,
                  guidance_scale=0.0,
                  width=512,  # Fixed resolution protecting the 16GB memory ceiling
                  height=512
              )
              
              end_time = time.time()
              print(f"Inference successfully compiled in {round(end_time - start_time, 2)} seconds.")
              
              # Safely parse the generated canvas file out of the image array wrapper
              image = output.images[0]
              image.save("cpu_output.png")
              print("Success: Generated image array saved safely to disk storage profiles.")
              
          except Exception as e:
              print(f"Critical execution error intercepted inside processing arrays: {str(e)}")
              sys.exit(1)
          EOF

      - name: Store Generated Asset File
        uses: actions/upload-artifact@v4
        with:
          name: cpu-generated-art
          path: cpu_output.png
          retention-days: 3
