name: Generate Image - Z-Image-Turbo (CPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Image generation prompt'
        required: true
        default: 'a scenic mountain landscape at sunset'
      steps:
        description: 'Inference steps'
        required: false
        default: '8'
      width:
        description: 'Image width'
        required: false
        default: '1024'
      height:
        description: 'Image height'
        required: false
        default: '1024'

jobs:
  generate:
    runs-on: ubuntu-latest  # use a larger runner (e.g. 64-core) via GitHub's runner size settings if needed
    timeout-minutes: 300    # CPU inference is slow — give it headroom, hard cap is 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors pillow huggingface_hub

      - name: Authenticate with Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import login
          import os
          login(token=os.environ['HF_TOKEN'])
          "

      - name: Run Z-Image-Turbo inference (CPU)
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}
          WIDTH: ${{ github.event.inputs.width }}
          HEIGHT: ${{ github.event.inputs.height }}
        run: |
          python << 'EOF'
          import os
          import torch
          from diffusers import DiffusionPipeline

          # NOTE: Replace with the actual Z-Image-Turbo repo id on Hugging Face.
          # This model is very new (mid-2026) — confirm the exact repo/class
          # name and required diffusers version before running, since the
          # loading code differs by architecture and this can go stale fast.
          MODEL_ID = "Tongyi-MAI/Z-Image-Turbo"

          pipe = DiffusionPipeline.from_pretrained(
              MODEL_ID,
              torch_dtype=torch.float32,  # CPU requires float32, not float16
          )
          pipe.to("cpu")

          prompt = os.environ["PROMPT"]
          steps = int(os.environ["STEPS"])
          width = int(os.environ["WIDTH"])
          height = int(os.environ["HEIGHT"])

          image = pipe(
              prompt=prompt,
              num_inference_steps=steps,
              width=width,
              height=height,
          ).images[0]

          os.makedirs("output", exist_ok=True)
          image.save("output/generated_image.png")
          print("Image saved.")
          EOF

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: output/generated_image.png
          retention-days: 7
