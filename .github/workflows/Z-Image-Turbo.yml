name: Z-Image-Turbo

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Text prompt for image generation'
        required: true
        default: 'A sleek modern cybernetic fox, vector art style, neon accents'

jobs:
  generate_on_cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama via Binary (Bypasses Script Blockers)
        run: |
          echo "Downloading official Ollama Linux binary directly..."
          # Download the static compiled binary directly to avoid installer script redirections
          curl -L https://ollama.com -o ollama-linux-amd64.tgz
          
          echo "Extracting binary to local user path..."
          # Extract safely directly into /usr which works on standard and custom self-hosted runners
          sudo tar -C /usr -xzf ollama-linux-amd64.tgz
          
          echo "Verifying installation version..."
          ollama --version

      - name: Configure and Start Ollama Service
        run: |
          # Configure performance allocations
          export OLLAMA_NUM_PARALLEL=1
          
          # Initialize and launch the daemon engine in the background safely
          sudo ollama serve > ollama.log 2>&1 &
          
          # Ensure loop handles validation check
          echo "Waiting for Ollama service to respond on local interface..."
          for i in {1..15}; do
            if curl -s http://127.0.0 > /dev/null; then
              echo "Ollama engine service successfully initialized!"
              exit 0
            fi
            sleep 2
          done
          echo "Error: Ollama service failed to bind to port 11434"
          cat ollama.log
          exit 1

      - name: Pull Memory-Optimized Z-Image-Turbo Model
        run: |
          echo "Fetching memory efficient weights..."
          # Pulling the quantized FP8 variant to prevent out of memory issues on CPU layers
          sudo ollama pull x/z-image-turbo:fp8

      - name: Generate Image via Local Localhost API
        run: |
          python - <<EOF
          import requests
          import json
          import base64

          endpoint = "http://127.0.0"
          
          payload = {
              "model": "x/z-image-turbo:fp8",
              "prompt": "${{ github.event.inputs.prompt }}",
              "stream": False,
              "options": {
                  "num_predict": 8
              }
          }

          print("Triggering local CPU image conversion processes...")
          try:
              response = requests.post(endpoint, json=payload, timeout=300)
              if response.status_code != 200:
                  print(f"Server response failure: {response.status_code} - {response.text}")
                  exit(1)
                  
              result = response.json()
              img_b64 = result.get('image', result.get('response', ''))
              
              if img_b64:
                  with open("cpu_output.png", "wb") as f:
                      f.write(base64.b64decode(img_b64))
                  print("Success: Generated image asset written out to cpu_output.png")
              else:
                  print("Error: Target output key structure missing from response packet.")
                  print(f"Keys available: {list(result.keys())}")
                  exit(1)
          except Exception as e:
              print(f"Runtime execution failure intercepted: {str(e)}")
              exit(1)
          EOF

      - name: Upload Output Asset
        uses: actions/upload-artifact@v4
        with:
          name: cpu-generated-art
          path: cpu_output.png
          retention-days: 3
